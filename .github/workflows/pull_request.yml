name: Dialogue Checks

on:
 pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Dialogue Checks
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Changed Files
        # The PR's merge commit against its base (its first parent): what the dialogue checks read.
        run: |
          git -c core.quotePath=false diff --name-only --no-renames --diff-filter=M HEAD^1 HEAD | jq -R . | jq -s . > ~/files_modified.json
          git -c core.quotePath=false diff --name-only --no-renames --diff-filter=A HEAD^1 HEAD | jq -R . | jq -s . > ~/files_added.json
          jq -s add ~/files_modified.json ~/files_added.json
      - name: Checkout frontent repo
        uses: actions/checkout@v7
        with:
          repository: AshleyThew/dialogue-maker
          path: dialogue-maker
      - name: Run Custom Action
        uses: ./
        with:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}